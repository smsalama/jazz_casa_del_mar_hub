    get:
      tags: [admin-enquiries]
      operationId: getEnquiry
      summary: Read one enquiry in full (FR-42)
      description: |
        Safe and changes nothing (NFR-22: state never changes on GET). When the portal opens an
        enquiry it marks it read with a separate `PATCH` carrying `{"read": true}` (`updateEnquiry`),
        which needs the CSRF token like every other admin write.
      responses:
        '200':
          description: Enquiry

openapi: 3.1.0
info:
  title: Jazz Casa del Mar concept site
  version: 0.1.0
  summary: Every HTTP endpoint of the single web application (public pages, public forms, operations, admin portal and admin JSON API).
  description: |
    Source of truth for the web repo `smsalama/jazz_casa_del_mar_web` (ADR-0005, ADR-0013).
    The web repo keeps a byte identical copy and generates its typed admin client from it
    with openapi-typescript; contract tests validate every handler against it.

    Conventions
    - Public pages and public forms speak HTML (`text/html`) and work without JavaScript (NFR-13).
      Public forms post `application/x-www-form-urlencoded` and use a signed `formToken`
      hidden field, never a cookie (NFR-22, LR-21).
    - The admin API speaks JSON under `/admin/api/`. Errors use RFC 9457 problem details
      (`application/problem+json`, schema `Problem`).
    - Every response carries the security headers of ADR-0008 and `X-Robots-Tag`
      (NFR-24, NFR-27). They are listed once in `components/headers` and repeated on the
      main responses; contract tests check them on every response.
    - Every admin response carries `Cache-Control: no-store` (NFR-20).
    - State changing admin requests need the session cookie and `X-CSRF-Token`
      (`adminSession` plus `csrfToken`). Sign in needs `X-Requested-With: jcdm-admin`
      (`adminClient`) and a matching `Origin` (ADR-0006).
    - Identifiers are UUID version 7 strings. A missing record returns 404 (NFR-25).
    - Times are RFC 3339 in UTC.
  license:
    name: Proprietary, client project (speculative concept)
    url: https://github.com/smsalama/jazz_casa_del_mar_hub
servers:
  - url: http://127.0.0.1:4321
    description: Local review (the only environment allowed in this release, NFR-18)
security:
  - adminSession: []
tags:
  - name: public-pages
    description: The 84 public pages (21 page types in four languages) and the root language redirect.
  - name: public-forms
    description: Contact form, newsletter sign up and unsubscribe. HTML in, HTML out.
  - name: operations
    description: Health check, robots file, static and media files.
  - name: admin-shell
    description: HTML shell pages of the admin portal (the React application).
  - name: admin-session
    description: Sign in, sign out, session information and own password.
  - name: admin-accounts
    description: Staff accounts (one Administrator role in this release).
  - name: admin-overview
    description: Main screen counts and warnings.
  - name: admin-content
    description: Page, global and room content entries and translation completeness.
  - name: admin-lists
    description: List items (venues, pools and beach, activities, offers, gallery, FAQ, attractions).
  - name: admin-settings
    description: Site settings.
  - name: admin-media
    description: Photo upload and library.
  - name: admin-enquiries
    description: Contact form enquiries.
  - name: admin-subscribers
    description: Newsletter subscribers and CSV export.

paths:
  /:
    get:
      tags: [public-pages]
      operationId: redirectToLanguage
      summary: Redirect the site root to a language page
      description: |
        Chooses the first of en, de, it or ru in `Accept-Language` (quality values respected),
        English otherwise (FR-25). Sets no cookie.
      security: []
      parameters:
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            maxLength: 1024
      responses:
        '302':
          description: Redirect to `/{lang}`
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Vary:
              $ref: '#/components/headers/VaryAcceptLanguage'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'

  /{lang}:
    get:
      tags: [public-pages]
      operationId: getHomePage
      summary: Home page with the 3D hero (FR-5, FR-27)
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /{lang}/{page}:
    get:
      tags: [public-pages]
      operationId: getSectionOrLegalPage
      summary: Section, list and legal pages (FR-1)
      description: |
        `rooms`, `dining`, `pools-and-beach`, `activities` and `location` carry a 3D scene (FR-28).
        `privacy`, `cookies`, `terms` and `accessibility` are the legal pages (FR-14 to FR-16).
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: page
          in: path
          required: true
          schema:
            type: string
            enum:
              - rooms
              - dining
              - pools-and-beach
              - activities
              - location
              - offers
              - gallery
              - faq
              - privacy
              - cookies
              - terms
              - accessibility
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /{lang}/rooms/{room}:
    get:
      tags: [public-pages]
      operationId: getRoomPage
      summary: One of the six fixed room pages (FR-2, OQ-20)
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: room
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RoomSlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'

  /{lang}/contact:
    get:
      tags: [public-pages]
      operationId: getContactPage
      summary: Contact Us page with the enquiry form (FR-19)
      description: The form carries a freshly signed `formToken` and the honeypot field `website`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'
    post:
      tags: [public-forms]
      operationId: submitEnquiry
      summary: Send an enquiry (FR-19, FR-20)
      description: |
        Validates with the same rules as the browser. Token, honeypot and timing failures all give
        the same retry message with typed values kept and a fresh token (FR-20, AC-13.10).
        An accepted token nonce is recorded so a refresh cannot create a duplicate (ADR-0006).
        Rate limit: 5 per hour per client address (NFR-21). Body limit 64 KB (NFR-35).
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactForm'
      responses:
        '200':
          description: Confirmation page stating the reference `ENQ-XXXXXX`, six characters from the 32 character alphabet `A-HJ-NP-Z2-9` (no `I` or `O`); the insert is retried with a new reference on a unique violation (FR-20, AC-13.4, data model D-5)
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyPublic'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlDocument'
        '400':
          $ref: '#/components/responses/HtmlFormRetry'
        '403':
          $ref: '#/components/responses/HtmlForbiddenOrigin'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '422':
          $ref: '#/components/responses/HtmlFormInvalid'
        '429':
          $ref: '#/components/responses/HtmlRateLimited'
        '503':
          $ref: '#/components/responses/HtmlFormUnavailable'

  /{lang}/newsletter:
    post:
      tags: [public-forms]
      operationId: subscribeNewsletter
      summary: Newsletter sign up from the footer form (FR-22)
      description: |
        Single opt in with a required consent tick. An address already subscribed (compared after
        trimming and ignoring case) gets the same confirmation and no second record. Median time is
        the same for both cases within 100 ms (G-11). Rate limit 5 per hour (NFR-21).
        Cap (NFR-35, data model D-4): the subscriber cap is checked before the address is looked up;
        once the cap is reached every sign up, new or already subscribed, gets the same 503 page, so
        the response never reveals whether an address exists.
        Suppression (data model D-3, proposed, pending T2): an address with a suppression entry is not
        stored and gets the same confirmation as any other address.
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewsletterForm'
      responses:
        '200':
          description: Confirmation page in the page language
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyPublic'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlDocument'
        '400':
          $ref: '#/components/responses/HtmlFormRetry'
        '403':
          $ref: '#/components/responses/HtmlForbiddenOrigin'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '422':
          $ref: '#/components/responses/HtmlFormInvalid'
        '429':
          $ref: '#/components/responses/HtmlRateLimited'
        '503':
          $ref: '#/components/responses/HtmlFormUnavailable'

  /{lang}/newsletter/unsubscribe:
    get:
      tags: [public-pages]
      operationId: getUnsubscribePage
      summary: Newsletter unsubscribe page (FR-23)
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '500':
          $ref: '#/components/responses/HtmlServerError'
    post:
      tags: [public-forms]
      operationId: unsubscribeNewsletter
      summary: Unsubscribe an address (FR-23)
      description: |
        Sets any active record for the address to unsubscribed. The same result page and the same
        median time whether or not the address was subscribed (G-11). Rate limit 10 per hour (NFR-21).
      security: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnsubscribeForm'
      responses:
        '200':
          description: Result page, identical for subscribed and unknown addresses
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicyPublic'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlDocument'
        '400':
          $ref: '#/components/responses/HtmlFormRetry'
        '403':
          $ref: '#/components/responses/HtmlForbiddenOrigin'
        '413':
          $ref: '#/components/responses/HtmlPayloadTooLarge'
        '422':
          $ref: '#/components/responses/HtmlFormInvalid'
        '429':
          $ref: '#/components/responses/HtmlRateLimited'
        '503':
          $ref: '#/components/responses/HtmlFormUnavailable'

  /healthz:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Health check (NFR-32)
      description: 200 only when the data store is readable and writable (a read and a one row write in a transaction).
      security: []
      responses:
        '200':
          description: Data store readable and writable
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Data store not readable or not writable
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFailure'

  /robots.txt:
    get:
      tags: [operations]
      operationId: getRobots
      summary: Robots file (disallows only `/admin/`, so crawlers can see the noindex rules, NFR-27)
      security: []
      responses:
        '200':
          description: Robots rules
          headers:
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
          content:
            text/plain:
              schema:
                type: string

  /media/{file}:
    get:
      tags: [operations]
      operationId: getMediaVariant
      summary: Public resized copy of an uploaded photo (FR-41)
      description: Only re-encoded, metadata free copies are served. Originals have no URL (NFR-18).
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-z]{26}-[0-9]{1,4}-(480|768|1280|1920)\.(avif|webp)$'
      responses:
        '200':
          description: Image file
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlImmutable'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
          content:
            image/avif:
              schema:
                $ref: '#/components/schemas/BinaryFile'
            image/webp:
              schema:
                $ref: '#/components/schemas/BinaryFile'
        '404':
          $ref: '#/components/responses/HtmlNotFound'

  /_astro/{file}:
    get:
      tags: [operations]
      operationId: getBuiltAsset
      summary: Fingerprinted build assets (scripts, styles, fonts, posters, 3D models)
      description: Served from the build output with precompressed variants when the client accepts them (NFR-35).
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.-]{1,200}$'
      responses:
        '200':
          description: Asset file
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlImmutable'
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            X-Robots-Tag:
              $ref: '#/components/headers/XRobotsTag'
          content:
            application/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
            font/woff2:
              schema:
                $ref: '#/components/schemas/BinaryFile'
            model/gltf-binary:
              schema:
                $ref: '#/components/schemas/BinaryFile'
            image/avif:
              schema:
                $ref: '#/components/schemas/BinaryFile'
            image/webp:
              schema:
                $ref: '#/components/schemas/BinaryFile'
        '404':
          $ref: '#/components/responses/HtmlNotFound'

  /admin:
    get:
      tags: [admin-shell]
      operationId: getAdminShell
      summary: Admin portal shell page
      description: |
        Redirects to `/admin/sign-in` without a valid session (FR-32). Shows a "setup required"
        page until the first Administrator is created by the server command (FR-47, G-1).
      security: []
      responses:
        '200':
          $ref: '#/components/responses/AdminShell'
        '303':
          $ref: '#/components/responses/AdminSignInRedirect'
        '503':
          $ref: '#/components/responses/AdminSetupRequired'

  /admin/{section}:
    get:
      tags: [admin-shell]
      operationId: getAdminSectionShell
      summary: Admin portal shell page for a top level screen
      security: []
      parameters:
        - $ref: '#/components/parameters/AdminSection'
      responses:
        '200':
          $ref: '#/components/responses/AdminShell'
        '303':
          $ref: '#/components/responses/AdminSignInRedirect'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '503':
          $ref: '#/components/responses/AdminSetupRequired'

  /admin/{section}/{itemId}:
    get:
      tags: [admin-shell]
      operationId: getAdminItemShell
      summary: Admin portal shell page for one item screen
      security: []
      parameters:
        - $ref: '#/components/parameters/AdminSection'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,100}$'
      responses:
        '200':
          $ref: '#/components/responses/AdminShell'
        '303':
          $ref: '#/components/responses/AdminSignInRedirect'
        '404':
          $ref: '#/components/responses/HtmlNotFound'
        '503':
          $ref: '#/components/responses/AdminSetupRequired'

  /admin/api/session:
    get:
      tags: [admin-session]
      operationId: getSession
      summary: Current session, including the CSRF token for later requests
      responses:
        '200':
          description: Signed in
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SetupRequired'
    post:
      tags: [admin-session]
      operationId: signIn
      summary: Sign in with email address and password (FR-32, NFR-19)
      description: |
        Every failure, including an unknown account, a wrong password, a disabled or a locked
        account, returns the same 401 problem with the same median time (NFR-19).
        On success a new session cookie is set (rotation, NFR-20).
        Rate limit 20 attempts per 15 minutes per client address (NFR-21).
      security:
        - adminClient: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/SignInFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [admin-session]
      operationId: signOut
      summary: Sign out and end the session on the server (FR-32)
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204':
          description: Signed out; the cookie is cleared
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/api/session/extend:
    post:
      tags: [admin-session]
      operationId: extendSession
      summary: Extend the idle timeout after the two minute warning (NFR-5)
      description: The absolute limit of 8 hours after sign in is never extended (NFR-20).
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '200':
          description: Idle timeout extended
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/api/me/password:
    post:
      tags: [admin-session]
      operationId: changeOwnPassword
      summary: Change own password; ends every session of the account (FR-34, NFR-20, G-19)
      description: |
        `currentPassword` is required except during the forced change at first sign in, which is
        one process and does not ask again for the temporary password (NFR-5).
        After success every session of the account ends, including this one, and the cookie is cleared.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; all sessions ended
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/api/overview:
    get:
      tags: [admin-overview]
      operationId: getOverview
      summary: Main screen counts and warnings (FR-36, FR-42, NFR-23, NFR-35)
      responses:
        '200':
          description: Overview
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SetupRequired'

  /admin/api/accounts:
    get:
      tags: [admin-accounts]
      operationId: listAccounts
      summary: List staff accounts (FR-34)
      responses:
        '200':
          description: Accounts
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [admin-accounts]
      operationId: createAccount
      summary: Create an account with a temporary password that must be changed at first sign in (FR-34)
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/api/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    patch:
      tags: [admin-accounts]
      operationId: updateAccount
      summary: Rename, disable or enable an account (FR-34)
      description: Disabling ends every session of the account (G-19). The last active Administrator cannot be disabled (409 `last_administrator`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [admin-accounts]
      operationId: deleteAccount

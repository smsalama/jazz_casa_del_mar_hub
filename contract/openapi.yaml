    post:
      tags: [admin-subscribers]
      operationId: exportSubscribers
      summary: Download subscribers as CSV (FR-43)
      description: |
        UTF-8 with a byte order mark; columns `email`, `language`, `status`, `subscribed_at`,
        `consent_version`; every cell quoted; a cell starting with `=`, `+`, `-`, `@`, tab or carriage
        return is prefixed with a single quote (G-4). Active subscribers only unless
        `includeUnsubscribed` is true. Recorded as a security event with the row count (NFR-34).
        The site keeps no copy of the file.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberExportRequest'
      responses:
        '200':
          description: CSV file
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionCsv'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-jcdm_admin
      description: |
        Server side session (256-bit random id, only its SHA-256 stored). `HttpOnly; SameSite=Strict`,
        plus `Secure` and the `__Host-` prefix whenever `PUBLIC_ORIGIN` is https. On a loopback
        `http://` origin during local review the cookie is named `jcdm_admin` without `Secure` (RSK-10).
        Idle limit 30 minutes, absolute limit 8 hours (NFR-20).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session bound anti forgery token from `Session.csrfToken`, required on every non GET admin request (NFR-22).
    adminClient:
      type: apiKey
      in: header
      name: X-Requested-With
      description: Must be `jcdm-admin`. With `Content-Type application/json` and a matching `Origin` it blocks login forgery (TM-27).

  parameters:
    Lang:
      name: lang
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LanguageCode'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    Origin:
      name: Origin
      in: header
      required: false
      description: When present it must equal the configured site origin, otherwise 403 (NFR-22).
      schema:
        type: string
        maxLength: 200
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    AdminSection:
      name: section
      in: path
      required: true
      schema:
        type: string
        enum:
          - sign-in
          - password
          - content
          - lists
          - translations
          - settings
          - media
          - enquiries
          - subscribers
          - accounts
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EntryKey:
      name: entryKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntryKey'
    ListKey:
      name: listKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ListKey'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EnquiryId:
      name: enquiryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SubscriberId:
      name: subscriberId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  headers:
    ContentSecurityPolicyPublic:
      description: Public policy of ADR-0008 (`default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; ...; frame-ancestors 'none'`)
      schema:
        type: string
    ContentSecurityPolicyAdmin:
      description: Admin policy of ADR-0008 (as public, without `wasm-unsafe-eval` and without `blob:` in `connect-src`)
      schema:
        type: string
    XRobotsTag:
      description: Always `noindex, nofollow, noarchive, nosnippet` (NFR-27)
      schema:
        type: string
        const: noindex, nofollow, noarchive, nosnippet
    XContentTypeOptions:
      schema:
        type: string
        const: nosniff
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    CacheControlNoCache:
      description: Pages revalidate on every request so saved edits show at once (FR-38)
      schema:
        type: string
        const: no-cache
    CacheControlImmutable:
      schema:
        type: string
        const: public, max-age=31536000, immutable
    ETag:
      schema:
        type: string
    Location:
      schema:
        type: string
    VaryAcceptLanguage:
      schema:
        type: string
        const: Accept-Language
    RetryAfter:
      description: Seconds until the rate limit window allows another request (NFR-21)
      schema:
        type: integer
        minimum: 1
    SetSessionCookie:
      description: The new session cookie (rotated at every sign in)
      schema:
        type: string
    ClearSessionCookie:
      description: Expires the session cookie
      schema:
        type: string
    ContentDispositionCsv:
      description: '`attachment; filename="subscribers-<yyyymmdd>.csv"`'
      schema:
        type: string

  responses:
    HtmlPage:
      description: Rendered page (noindex, concept notice, title suffix)
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyPublic'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoCache'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    NotModified:
      description: Content unchanged since the given ETag
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
    HtmlNotFound:
      description: Localised "page not found" page (FR-13)
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyPublic'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlServerError:
      description: Localised "something went wrong" page with a correlation id and no technical detail (FR-13, NFR-26)
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyPublic'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlFormRetry:
      description: |
        Spam trap filled, token missing, altered, expired or younger than 2 seconds. The form is shown
        again with typed values kept, a fresh token and the single retry message in a `role="alert"`
        element that receives focus (FR-20, AC-13.10). Nothing is stored.
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyPublic'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlFormInvalid:
      description: Validation errors next to each field and in a summary at the top, values kept (FR-19)
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyPublic'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlForbiddenOrigin:
      description: '`Origin` or `Referer` does not match the site origin (NFR-22). Nothing is stored.'
      headers:
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlPayloadTooLarge:
      description: Body over 64 KB (NFR-35)
      headers:
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlRateLimited:
      description: Too many submissions from this address; localised page (NFR-21)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    HtmlFormUnavailable:
      description: |
        The record could not be stored (data store error, or the cap of NFR-35 reached). The form is
        shown again with an error message and typed values kept; no confirmation (FR-20). For newsletter
        sign up the cap is checked before the address is looked up, so at the cap every address gets
        this same response (D-4).
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyPublic'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    AdminShell:
      description: Shell page that loads the admin application bundle (no inline script)
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyAdmin'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    AdminSignInRedirect:
      description: Not signed in; redirect to `/admin/sign-in` (FR-32)
      headers:
        Location:
          $ref: '#/components/headers/Location'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
    AdminSetupRequired:
      description: No Administrator exists yet; the page names the server command to run (FR-47, G-1)
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/ContentSecurityPolicyAdmin'
        X-Robots-Tag:
          $ref: '#/components/headers/XRobotsTag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/HtmlDocument'
    Unauthenticated:
      description: Not signed in or the session has ended (NFR-25)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SignInFailed:
      description: One generic message for every sign in failure (FR-32, NFR-19)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing or invalid CSRF token, wrong `Origin`, or missing `X-Requested-With` (NFR-22); `setup_required` before the first Administrator exists
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SetupRequired:
      description: No Administrator exists yet (FR-47, G-1); code `setup_required`
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record or route (NFR-25)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: '`version_conflict` (stale save, `current` holds the stored value), `in_use` (media used on pages, `usage` lists them), `last_administrator`, or `duplicate` (email address already has an account)'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body over 1 MB for admin requests or 10 MB for uploads (NFR-23, NFR-35)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: File content is not JPEG, PNG, WebP or AVIF, or disagrees with its name (NFR-23)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: One or more fields invalid; `errors` names each field (and language) and the problem
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded (NFR-21)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: Media storage limit reached (NFR-23); code `quota_exceeded`
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Id:
      type: string
      format: uuid
      description: UUID version 7
    LanguageCode:
      type: string
      enum: [en, de, it, ru]
    RoomSlug:
      type: string
      enum:
        - family-suite
        - executive-suite
        - superior-twin-sea-view
        - superior-queen-sea-view
        - triple-deluxe-twin-pool-view
        - triple-deluxe-queen-pool-view
    EntryKey:
      type: string
      description: Registry key of a page, global group or room entry, for example `page.home`, `global.footer`, `room.family-suite`
      pattern: '^(page|global|room)\.[a-z0-9-]{1,60}$'
    ListKey:
      type: string
      enum:
        - dining-venues
        - pools-and-beach
        - activities
        - offers
        - gallery
        - faq
        - attractions
    HtmlDocument:
      type: string
      description: A complete UTF-8 HTML document with `lang`, the robots meta tag, the concept notice and no inline script
    BinaryFile:
      type: string
      contentMediaType: application/octet-stream
    Timestamp:
      type: string
      format: date-time

    Problem:
      type: object
      description: RFC 9457 problem details
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: '`about:blank` or a stable URI per code'
          maxLength: 200
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
          maxLength: 1000
        correlationId:
          type: string
          maxLength: 64
        errors:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FieldError'
        retryAfterSeconds:
          type: integer
          minimum: 1
        current:
          description: For `version_conflict`, the stored entry, item, list (for a reorder) or settings the save was refused against
          type: object
        usage:
          description: For `in_use`, where the media is used
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/MediaUsage'
    ProblemCode:
      type: string
      enum:
        - validation_failed
        - unauthenticated
        - sign_in_failed
        - password_change_required
        - csrf_failed
        - origin_mismatch
        - setup_required
        - not_found
        - version_conflict
        - in_use
        - last_administrator
        - duplicate
        - password_rejected
        - payload_too_large
        - unsupported_media_type
        - image_too_large
        - processing_failed
        - quota_exceeded
        - cap_reached
        - rate_limited
        - server_error
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Field path, for example `fields[3].value.de` or `bookNowUrl`
          maxLength: 300
        language:
          $ref: '#/components/schemas/LanguageCode'
        code:
          type: string
          enum:
            - required
            - too_short
            - too_long
            - invalid_format
            - invalid_url
            - invalid_scheme
            - forbidden_characters
            - not_allowed_markup
            - unknown_field
            - media_missing_alt
            - media_not_found
            - out_of_range
            - common_password
            - contains_email
        message:
          type: string
          maxLength: 500

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthFailure:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: unavailable

    ContactForm:
      type: object
      description: Same rules run in the browser and on the server (FR-19)
      additionalProperties: false
      required: [name, email, subject, message, formToken]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        telephone:
          type: string
          description: Optional; empty or 7 to 20 characters from digits, spaces, plus, brackets and hyphens
          pattern: '^$|^[0-9 +()-]{7,20}$'
        subject:
          $ref: '#/components/schemas/EnquirySubject'
        message:
          type: string
          minLength: 10
          maxLength: 2000
        website:
          type: string
          description: Spam trap; must be empty
          maxLength: 200
        formToken:
          $ref: '#/components/schemas/FormToken'
    NewsletterForm:
      type: object
      additionalProperties: false
      required: [email, consent, formToken]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        consent:
          type: string
          description: The unticked by default consent box; required (FR-22)
          const: 'yes'
        website:
          type: string
          description: Spam trap; must be empty
          maxLength: 200
        formToken:
          $ref: '#/components/schemas/FormToken'
    UnsubscribeForm:
      type: object
      additionalProperties: false
      required: [email, formToken]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        website:
          type: string
          description: Spam trap; must be empty
          maxLength: 200
        formToken:
          $ref: '#/components/schemas/FormToken'
    FormToken:
      type: string
      description: base64url payload (form, language, issued time, nonce), a dot, and its HMAC-SHA256 (ADR-0006)
      pattern: '^[A-Za-z0-9_-]{20,400}\.[A-Za-z0-9_-]{43}$'

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 256
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - account
        - mustChangePassword
        - previousSignInAt
        - failedAttemptsSinceLastSignIn
        - idleExpiresAt
        - absoluteExpiresAt
        - csrfToken
      properties:
        account:
          $ref: '#/components/schemas/AccountRef'
        mustChangePassword:
          type: boolean
          description: When true every admin request except the password change and sign out returns 403 `password_change_required`
        previousSignInAt:
          description: Time of the previous successful sign in (G-23)
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        failedAttemptsSinceLastSignIn:
          type: integer
          minimum: 0
        idleExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        csrfToken:
          type: string
          minLength: 43
          maxLength: 128
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 256
          writeOnly: true
        newPassword:
          type: string
          description: 12 to 128 characters, not a common password, not containing the account email (NFR-19)
          minLength: 12
          maxLength: 128
          writeOnly: true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true

    AccountRef:
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 100
    Account:
      type: object
      additionalProperties: false
      required: [id, email, name, status, locked, mustChangePassword, createdAt, lastSignInAt, isCurrent]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 100
        status:
          type: string
          enum: [active, disabled]
        locked:
          type: boolean
          description: True while a lockout of NFR-19 is in force
        mustChangePassword:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSignInAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        isCurrent:
          type: boolean
          description: True for the signed in account
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [email, name, temporaryPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
        temporaryPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum: [active, disabled]

    Overview:
      type: object
      additionalProperties: false
      required: [unreadEnquiries, enquiries, subscribers, media, listsBelowMinimum, missingTranslations, jobs]
      properties:
        unreadEnquiries:
          type: integer
          minimum: 0
        enquiries:
          $ref: '#/components/schemas/CapUsage'
        subscribers:
          $ref: '#/components/schemas/CapUsage'
        media:
          $ref: '#/components/schemas/StorageUsage'
        listsBelowMinimum:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ListSummary'
        missingTranslations:
          type: object
          additionalProperties: false
          required: [de, it, ru]
          properties:
            de:
              type: integer
              minimum: 0
            it:
              type: integer
              minimum: 0
            ru:
              type: integer
              minimum: 0
        jobs:
          type: object
          additionalProperties: false
          required: [purge, backup]
          properties:
            purge:
              $ref: '#/components/schemas/JobStatus'
            backup:
              $ref: '#/components/schemas/JobStatus'
    CapUsage:
      type: object
      additionalProperties: false
      required: [count, cap, warning]
      properties:
        count:
          type: integer
          minimum: 0
        cap:
          type: integer
          minimum: 1
        warning:
          type: boolean
          description: True at 80 percent of the cap or above (NFR-35)
    StorageUsage:
      type: object
      additionalProperties: false
      required: [usedBytes, limitBytes, warning]
      properties:
        usedBytes:
          type: integer
          minimum: 0
        limitBytes:
          type: integer
          minimum: 1
        warning:
          type: boolean
          description: True at 80 percent of the limit or above (NFR-23)
    JobStatus:
      type: object
      additionalProperties: false
      required: [lastResult, lastRunAt, lastSuccessAt]
      properties:
        lastResult:
          type: string
          enum: [never, success, failed, skipped]
        lastRunAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lastSuccessAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        message:
          type: string
          maxLength: 300

    LocalisedText:
      type: object
      description: Plain text in four languages; an empty string means missing (shown in English on the public site, FR-26). No Unicode category Cf except soft hyphen (G-7).
      additionalProperties: false
      required: [en, de, it, ru]
      properties:
        en:
          type: string
          maxLength: 20000
        de:
          type: string
          maxLength: 20000
        it:
          type: string
          maxLength: 20000
        ru:
          type: string
          maxLength: 20000
    LocalisedRichText:
      type: object
      description: Rich text in four languages; null means missing
      additionalProperties: false
      required: [en, de, it, ru]
      properties:
        en:
          $ref: '#/components/schemas/NullableRichTextDoc'
        de:
          $ref: '#/components/schemas/NullableRichTextDoc'
        it:
          $ref: '#/components/schemas/NullableRichTextDoc'
        ru:
          $ref: '#/components/schemas/NullableRichTextDoc'
    NullableRichTextDoc:
      oneOf:
        - $ref: '#/components/schemas/RichTextDoc'
        - type: 'null'
    RichTextDoc:
      type: object
      description: Allow-listed ProseMirror document (ADR-0005). Anything else is rejected with 422.
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          maxItems: 200
          items:
            oneOf:
              - $ref: '#/components/schemas/RichParagraph'
              - $ref: '#/components/schemas/RichBulletList'
    RichParagraph:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: paragraph
        content:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/RichTextRun'
    RichBulletList:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: bulletList
        content:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RichListItem'
    RichListItem:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          type: string
          const: listItem
        content:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RichParagraph'
    RichTextRun:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 10000
        marks:
          type: array
          maxItems: 3
          items:
            oneOf:
              - $ref: '#/components/schemas/RichMarkSimple'
              - $ref: '#/components/schemas/RichMarkLink'
    RichMarkSimple:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [bold, italic]
    RichMarkLink:
      type: object
      additionalProperties: false
      required: [type, attrs]
      properties:
        type:
          type: string
          const: link
        attrs:
          type: object
          additionalProperties: false
          required: [href]
          properties:
            href:
              type: string
              description: Parsed with the WHATWG URL parser on the server; scheme must be https, http, mailto or tel
              maxLength: 2048
              pattern: '^(https?://|mailto:|tel:)'
    MediaRef:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId:
          $ref: '#/components/schemas/Id'

    LanguageCompleteness:
      type: object
      additionalProperties: false
      required: [complete, total]
      properties:
        complete:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    Completeness:
      type: object
      description: Shown as "3 of 4 languages complete" per entry or item (FR-37)
      additionalProperties: false
      required: [en, de, it, ru, languagesComplete]
      properties:
        en:
          $ref: '#/components/schemas/LanguageCompleteness'
        de:
          $ref: '#/components/schemas/LanguageCompleteness'
        it:
          $ref: '#/components/schemas/LanguageCompleteness'
        ru:
          $ref: '#/components/schemas/LanguageCompleteness'
        languagesComplete:
          type: integer
          minimum: 0
          maximum: 4

    ContentField:
      description: One editable field with its descriptor and current value (ADR-0004); the `type` constant tells the variants apart
      oneOf:
        - $ref: '#/components/schemas/TextField'
        - $ref: '#/components/schemas/RichTextField'
        - $ref: '#/components/schemas/MediaField'
        - $ref: '#/components/schemas/TextListField'
    TextField:
      type: object
      additionalProperties: false
      required: [type, path, label, required, maxLength, multiline, value]
      properties:
        type:
          type: string
          const: text
        path:
          type: string
          description: Stable field path inside the entry or item, for example `hero.heading`
          pattern: '^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)*$'
          maxLength: 200
        label:
          type: string
          maxLength: 200
        help:
          type: string
          maxLength: 500
        required:
          type: boolean
          description: Whether English must be non empty to save
        maxLength:
          type: integer
          minimum: 1
          maximum: 20000
        multiline:
          type: boolean
        value:
          $ref: '#/components/schemas/LocalisedText'
    RichTextField:
      type: object
      additionalProperties: false
      required: [type, path, label, required, maxLength, value]
      properties:
        type:
          type: string
          const: richText
        path:
          type: string
          description: Stable field path inside the entry or item, for example `hero.heading`
          pattern: '^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)*$'
          maxLength: 200
        label:
          type: string
          maxLength: 200
        help:
          type: string
          maxLength: 500
        required:
          type: boolean
          description: Whether English must be non empty to save
        maxLength:
          type: integer
          description: Maximum characters of text per language
          minimum: 1
          maximum: 50000
        value:
          $ref: '#/components/schemas/LocalisedRichText'
    MediaField:
      type: object
      additionalProperties: false
      required: [type, path, label, required, value]
      properties:
        type:
          type: string
          const: media
        path:
          type: string
          description: Stable field path inside the entry or item, for example `hero.heading`
          pattern: '^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)*$'
          maxLength: 200
        label:
          type: string
          maxLength: 200
        help:
          type: string
          maxLength: 500
        required:
          type: boolean
          description: Whether English must be non empty to save
        value:
          oneOf:
            - $ref: '#/components/schemas/MediaRef'
            - type: 'null'
        preview:
          description: Thumbnail and alternative text of the chosen photo, for display
          oneOf:
            - $ref: '#/components/schemas/MediaPreview'
            - type: 'null'
    TextListField:
      type: object
      additionalProperties: false
      required: [type, path, label, required, maxLength, minItems, maxItems, value]
      properties:
        type:
          type: string
          const: textList
        path:
          type: string
          description: Stable field path inside the entry or item, for example `hero.heading`
          pattern: '^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)*$'
          maxLength: 200
        label:
          type: string
          maxLength: 200
        help:
          type: string
          maxLength: 500
        required:
          type: boolean
          description: Whether English must be non empty to save
        maxLength:
          type: integer
          minimum: 1
          maximum: 2000
        minItems:
          type: integer
          minimum: 0
          description: Below this the portal warns; saving is never blocked (FR-36)
        maxItems:
          type: integer
          minimum: 1
          maximum: 100
        value:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LocalisedText'
    FieldValueUpdate:
      type: object
      additionalProperties: false
      required: [path, value]
      properties:
        path:
          type: string
          maxLength: 200
        value:
          anyOf:
            - $ref: '#/components/schemas/LocalisedText'
            - $ref: '#/components/schemas/LocalisedRichText'
            - $ref: '#/components/schemas/MediaRef'
            - type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/LocalisedText'
            - type: 'null'

    ContentEntryBase:
      type: object
      required: [key, kind, label, publicPaths, version, updatedAt, completeness]
      properties:
        key:
          $ref: '#/components/schemas/EntryKey'
        kind:
          type: string
          enum: [page, global, room]
        label:
          type: string
          maxLength: 200
        publicPaths:
          type: array
          description: English public paths where this entry is shown, for "view page" links
          maxItems: 21
          items:
            type: string
            maxLength: 200
        version:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: 'null'
        completeness:
          $ref: '#/components/schemas/Completeness'
    ContentEntrySummary:
      allOf:
        - $ref: '#/components/schemas/ContentEntryBase'
      type: object
      unevaluatedProperties: false
    ContentEntry:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ContentEntryBase'
        - type: object
          required: [fields]
          properties:
            fields:
              type: array
              maxItems: 300
              items:
                $ref: '#/components/schemas/ContentField'
    ContentEntryUpdate:
      type: object
      additionalProperties: false
      required: [version, fields]
      properties:
        version:
          type: integer
          minimum: 1
        fields:
          type: array
          minItems: 1
          maxItems: 300
          items:
            $ref: '#/components/schemas/FieldValueUpdate'

    ListSummary:
      type: object
      additionalProperties: false
      required: [key, version, label, itemLabel, minItems, maxItems, count, belowMinimum, publicPaths]
      properties:
        key:
          $ref: '#/components/schemas/ListKey'
        version:
          type: integer
          minimum: 1
          description: List order version; goes up by 1 whenever an item is added, deleted or the list is reordered. Required by `reorderList` (D-7)
        label:
          type: string
          maxLength: 200
        itemLabel:
          type: string
          maxLength: 100
        minItems:
          type: integer
          minimum: 0
          description: Minimum from FR-2 to FR-9; the portal warns below it (FR-36)
        maxItems:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 0
        belowMinimum:
          type: boolean
        publicPaths:
          type: array
          maxItems: 21
          items:
            type: string
            maxLength: 200
    ListItemBase:
      type: object
      required: [id, position, version, label, completeness]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        position:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        label:
          type: string
          description: The English title of the item, for lists and confirmations
          maxLength: 300
        completeness:
          $ref: '#/components/schemas/Completeness'
    ListItemSummary:
      allOf:
        - $ref: '#/components/schemas/ListItemBase'
      type: object
      unevaluatedProperties: false
    ListItem:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ListItemBase'
        - type: object
          required: [listKey, fields, updatedAt]
          properties:
            listKey:
              $ref: '#/components/schemas/ListKey'
            updatedAt:
              $ref: '#/components/schemas/Timestamp'
            fields:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ContentField'
    ListWithItems:
      type: object
      additionalProperties: false
      required: [list, items]
      properties:
        list:
          $ref: '#/components/schemas/ListSummary'
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ListItemSummary'
    ListItemCreate:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldValueUpdate'
    ListItemUpdate:
      type: object
      additionalProperties: false
      required: [version, fields]
      properties:
        version:
          type: integer
          minimum: 1
        fields:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldValueUpdate'
    ListOrderUpdate:
      type: object
      additionalProperties: false
      required: [version, itemIds]
      properties:
        version:
          type: integer
          minimum: 1
          description: The list order version (`ListSummary.version`) the new order is based on (NFR-33, data model D-7)
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    MissingTranslation:
      type: object
      additionalProperties: false
      required: [owner, ownerLabel, fieldPath, fieldLabel, missing, adminPath]
      properties:
        owner:
          type: string
          description: Entry key, or `<listKey>/<itemId>` for a list item, or `media/<mediaId>` for alternative text and captions
          maxLength: 200
        ownerLabel:
          type: string
          maxLength: 300
        fieldPath:
          type: string
          maxLength: 200
        fieldLabel:
          type: string
          maxLength: 200
        missing:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LanguageCode'
        adminPath:
          type: string
          description: Portal path that opens the field
          maxLength: 300

    HttpsUrl:
      type: string
      description: Absolute https URL without user name or password, at most 2,048 characters (FR-39, G-5)
      format: uri
      maxLength: 2048
      pattern: '^https://[^/@\s]+(/[^\s]*)?$'
    NullableHttpsUrl:
      oneOf:
        - $ref: '#/components/schemas/HttpsUrl'
        - type: 'null'
    PhoneNumber:
      type: string
      description: Digits, spaces and a leading plus sign only (FR-39)
      pattern: '^\+?[0-9 ]{5,30}$'
    SettingsValues:
      type: object
      required:
        - bookNowUrl
        - mapsUrl
        - social
        - telephone
        - whatsapp
        - email
        - postalAddress
        - conceptSentence
        - provider
      properties:
        bookNowUrl:
          $ref: '#/components/schemas/HttpsUrl'
        mapsUrl:
          $ref: '#/components/schemas/HttpsUrl'
        social:
          type: object
          description: Empty (null) links are not rendered (FR-12)
          additionalProperties: false
          required: [instagram, facebook, linkedin, x, youtube]
          properties:
            instagram:
              $ref: '#/components/schemas/NullableHttpsUrl'
            facebook:
              $ref: '#/components/schemas/NullableHttpsUrl'
            linkedin:
              $ref: '#/components/schemas/NullableHttpsUrl'
            x:
              $ref: '#/components/schemas/NullableHttpsUrl'
            youtube:
              $ref: '#/components/schemas/NullableHttpsUrl'
        telephone:
          $ref: '#/components/schemas/PhoneNumber'
        whatsapp:
          oneOf:
            - $ref: '#/components/schemas/PhoneNumber'
            - type: 'null'
        email:
          type: string
          format: email
          maxLength: 254
        postalAddress:
          type: string
          minLength: 1
          maxLength: 500
        conceptSentence:
          description: Optional plain sentence after the fixed concept sentence, at most 200 characters per language (FR-17)
          type: object
          additionalProperties: false
          required: [en, de, it, ru]
          properties:
            en:
              type: string
              maxLength: 200
            de:
              type: string
              maxLength: 200
            it:
              type: string
              maxLength: 200
            ru:
              type: string
              maxLength: 200
        provider:
          $ref: '#/components/schemas/ProviderDetails'
    ProviderDetails:
      type: object
      description: The "Who runs this site" section of the Terms (FR-16, FR-39, LR-32); defaults are marked placeholders
      additionalProperties: false
      required:
        - legalName
        - geographicAddress
        - contactEmail
        - tradeRegister
        - supervisoryAuthority
        - professionalDetails
        - vatNumber
      properties:
        legalName:
          type: string
          maxLength: 200
        geographicAddress:
          type: string
          maxLength: 500
        contactEmail:
          type: string
          maxLength: 254
        tradeRegister:
          type: string
          maxLength: 300
        supervisoryAuthority:
          type: string
          maxLength: 300
        professionalDetails:
          type: string
          maxLength: 500
        vatNumber:
          type: string
          maxLength: 50
    Settings:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SettingsValues'
        - type: object
          required: [version, updatedAt]
          properties:
            version:
              type: integer
              minimum: 1
            updatedAt:
              $ref: '#/components/schemas/Timestamp'
    SettingsUpdate:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SettingsValues'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1

    MediaVariant:
      type: object
      additionalProperties: false
      required: [width, format, url, bytes]
      properties:
        width:
          type: integer
          enum: [480, 768, 1280, 1920]
        format:
          type: string
          enum: [avif, webp]
        url:
          type: string
          maxLength: 200
        bytes:
          type: integer
          minimum: 1
    MediaUsage:
      type: object
      additionalProperties: false
      required: [owner, ownerLabel, publicPaths]
      properties:
        owner:
          type: string
          maxLength: 200
        ownerLabel:
          type: string
          maxLength: 300
        publicPaths:
          type: array
          maxItems: 84
          items:
            type: string
            maxLength: 200
    MediaPreview:
      type: object
      additionalProperties: false
      required: [mediaId, thumbnailUrl, altEn]
      properties:
        mediaId:
          $ref: '#/components/schemas/Id'
        thumbnailUrl:
          type: string
          maxLength: 200
        altEn:
          type: string
          maxLength: 300
    MediaAsset:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - mimeType
        - sizeBytes
        - width
        - height
        - uploadedAt
        - updatedAt
        - version
        - alt
        - caption
        - usableOnPublicPages
        - thumbnailUrl
        - variants
        - usage
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 200
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/avif]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        uploadedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
        alt:
          description: Alternative text, at most 300 characters per language
          $ref: '#/components/schemas/LocalisedText'
        caption:
          description: Caption, at most 300 characters per language
          $ref: '#/components/schemas/LocalisedText'
        usableOnPublicPages:
          type: boolean
          description: False until English alternative text exists (FR-40)
        thumbnailUrl:
          type: string
          maxLength: 200
        variants:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MediaVariant'
        usage:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/MediaUsage'
    MediaList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, storage]
      properties:
        items:
          type: array
          maxItems: 48
          items:
            $ref: '#/components/schemas/MediaAsset'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          const: 48
        total:
          type: integer
          minimum: 0
        storage:
          $ref: '#/components/schemas/StorageUsage'
    MediaMetadataUpdate:
      type: object
      additionalProperties: false
      required: [version, name, alt, caption]
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        alt:
          $ref: '#/components/schemas/LocalisedText'
        caption:
          $ref: '#/components/schemas/LocalisedText'

    EnquiryStatus:
      type: string
      enum: [unhandled, handled]
    EnquirySubject:
      type: string
      description: '`general` is "General enquiry" (default); `data_protection` is "Data protection request or complaint" (FR-19, LR-5)'
      enum: [general, data_protection]
    EnquiryBase:
      type: object
      required: [id, reference, name, email, subject, language, receivedAt, status, read, dataProtection, acknowledgeBy]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        reference:
          type: string
          description: Generated from the 32 character alphabet `A-HJ-NP-Z2-9`; the pattern accepts the wider `A-Z2-9` set, which every generated value satisfies (data model D-5)
          pattern: '^ENQ-[A-Z2-9]{6}$'
        name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        subject:
          $ref: '#/components/schemas/EnquirySubject'
        language:
          $ref: '#/components/schemas/LanguageCode'
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/EnquiryStatus'
        read:
          type: boolean
        dataProtection:
          type: boolean
          description: Subject was data protection, or an Administrator marked it so (FR-42)
        acknowledgeBy:
          description: Received date plus 30 calendar days when `dataProtection` is true (LR-5)
          oneOf:
            - type: string
              format: date
            - type: 'null'
    EnquirySummary:
      allOf:
        - $ref: '#/components/schemas/EnquiryBase'
      type: object
      unevaluatedProperties: false
    Enquiry:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EnquiryBase'
        - type: object
          required: [telephone, message, privacyTextVersion]
          properties:
            telephone:
              oneOf:
                - type: string
                  maxLength: 20
                - type: 'null'
            message:
              type: string
              maxLength: 2000
            privacyTextVersion:
              type: string
              maxLength: 50
    EnquiryList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, unreadCount]
      properties:
        items:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/EnquirySummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          const: 25
        total:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
    EnquiryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        read:
          type: boolean
          description: True marks the enquiry read (sent when the portal opens it); false marks it unread (FR-42)
        status:
          $ref: '#/components/schemas/EnquiryStatus'
        dataProtection:
          type: boolean

    SubscriberStatus:
      type: string
      enum: [active, unsubscribed]
    Subscriber:
      type: object
      additionalProperties: false
      required: [id, email, language, status, subscribedAt, unsubscribedAt, consentVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          maxLength: 254
        language:
          $ref: '#/components/schemas/LanguageCode'
        status:
          $ref: '#/components/schemas/SubscriberStatus'
        subscribedAt:
          $ref: '#/components/schemas/Timestamp'
        unsubscribedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        consentVersion:
          type: string
          maxLength: 50
    SubscriberList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, activeTotal]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Subscriber'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          const: 50
        total:
          type: integer
          minimum: 0
        activeTotal:
          type: integer
          minimum: 0
    SubscriberExportRequest:
      type: object
      additionalProperties: false
      required: [includeUnsubscribed]
      properties:
        includeUnsubscribed:
          type: boolean

      tags: [admin-enquiries]
      operationId: updateEnquiry
      summary: Mark read or unread, handled or unhandled, or mark as a data protection request (FR-42)
      description: |
        `read: true` records the time it was first read (sent by the portal when an enquiry is opened);
        `read: false` returns it to unread. Idempotent flags, not versioned (data model section 6).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnquiryUpdate'
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enquiry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':

  /admin/api/media:
    get:
      tags: [admin-media]
      operationId: listMedia
      summary: Media library, newest first, with storage use (FR-40, NFR-23)
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Media page
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [admin-media]
      operationId: uploadMedia
      summary: Upload one photo (one file per request; a batch is up to 20 requests) (FR-40, FR-41, NFR-23)
      description: |
        The body is the raw file. Its content must be JPEG, PNG, WebP or AVIF (checked from the bytes,
        not the name), at most 10 MB and 40 megapixels. Processing (resize to 480, 768, 1280 and 1920
        wide in AVIF and WebP, orientation applied, all metadata removed) runs in an isolated worker
        with a 60 s and 256 MB limit, one job at a time (ADR-0009). Rate limit 30 per hour per account.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - name: name
          in: query
          required: true
          description: Display name shown in the library; never used as a file name
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: batch
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: index
          in: query
          required: false
          description: Position of this file in its batch, 0 to 19
          schema:
            type: integer
            minimum: 0
            maximum: 19
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/BinaryFile'
      responses:
        '201':
          description: Uploaded and processed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
